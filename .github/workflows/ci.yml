name: CI

on:
  workflow_call:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest --cov=printwatch --cov-report=term-missing
      - name: Compile
        run: python -m compileall src
