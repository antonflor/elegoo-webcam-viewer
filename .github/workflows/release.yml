name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/printwatch.spec
      - name: Create portable ZIP
        shell: pwsh
        run: >-
          Compress-Archive -Path "dist/PrintWatch Desktop/*"
          -DestinationPath "PrintWatch-Desktop-Windows-x64-Portable.zip"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          Copy-Item dist-installer\*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            PrintWatch-Desktop-Windows-x64-Portable.zip
            PrintWatch-Desktop-*-Windows-x64-Setup.exe
          if-no-files-found: error

  macos-arm64:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/printwatch.spec
      - name: Archive app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent "dist/PrintWatch Desktop.app"
          PrintWatch-Desktop-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: PrintWatch-Desktop-macOS-arm64.zip
          if-no-files-found: error

  linux-x64:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install --quiet -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/printwatch.spec
      - name: Archive bundle
        run: tar -C dist -czf PrintWatch-Desktop-Linux-x64.tar.gz "PrintWatch Desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: PrintWatch-Desktop-Linux-x64.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: artifacts/linux
      - name: Flatten release assets
        run: |
          find artifacts -mindepth 2 -type f -exec mv -t artifacts {} +
          find artifacts -mindepth 1 -type d -empty -delete
      - name: Generate checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
